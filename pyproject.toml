[project]
name = "clonebox"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "chatterbox-tts==0.1.7",
    "setuptools<81",  # resemble-perth (watermarker) imports pkg_resources
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "python-multipart>=0.0.9",
    "structlog>=24.1",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
